name: Android CI
on:
  push:
    branches: [master, main]
    paths:
      - "android/**"
      - "docs/api/**"
      - "worker/src/api/v1.js"
      - "worker/src/mobile-session.js"
      - "worker/src/realtime-tickets.js"
      - "worker/migrations/2026-08-30-mobile-client-v1.sql"
      - "worker/schema.sql"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "docs/api/**"
      - "worker/src/api/v1.js"
      - "worker/src/mobile-session.js"
      - "worker/src/realtime-tickets.js"
      - "worker/migrations/2026-08-30-mobile-client-v1.sql"
      - "worker/schema.sql"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: edgechat-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
